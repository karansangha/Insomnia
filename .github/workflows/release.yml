name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set App Version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $VERSION"
          plutil -replace CFBundleShortVersionString -string "$VERSION" insomnia/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" insomnia/Info.plist

      - name: Run Tests
        run: swift test

      - name: Build App and Create DMG
        run: |
          chmod +x install_app.sh
          chmod +x create_dmg.sh
          ./create_dmg.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Insomnia_Installer.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
