name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release DMG
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set App Version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          plutil -replace CFBundleShortVersionString -string "$VERSION" Sources/Insomnia/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Sources/Insomnia/Info.plist

      - name: Run Tests
        run: swift test

      - name: Build and Sign
        run: |
          chmod +x install_app.sh create_dmg.sh
          APP_VERSION=${{ env.VERSION }} ./install_app.sh
          APP_VERSION=${{ env.VERSION }} ./create_dmg.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Insomnia_${{ env.VERSION }}_Installer.dmg
          generate_release_notes: true
          draft: true
          prerelease: false
